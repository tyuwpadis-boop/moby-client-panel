<!--
  Widget de chat à intégrer dans ton site.
  Copie ce bloc juste avant la balise </body> de tes pages HTML.
  Pense à changer BACKEND_URL vers l'adresse de ton backend déployé.
-->
<div id="repair-chat-widget">
  <button id="rcw-toggle" aria-label="Ouvrir le chat">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
  </button>

  <div id="rcw-panel">
    <div id="rcw-header">
      <span>Assistant réparation</span>
      <button id="rcw-close" aria-label="Fermer">&times;</button>
    </div>
    <div id="rcw-messages"></div>
    <form id="rcw-form">
      <input id="rcw-input" type="text" placeholder="Écris ton message..." autocomplete="off" />
      <button type="submit" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>
  </div>
</div>

<style>
  #repair-chat-widget * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

  #rcw-toggle {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    width: 56px; height: 56px; border-radius: 50%;
    background: #0f6e56; color: #fff; border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25); cursor: pointer;
  }

  #rcw-panel {
    position: fixed; bottom: 92px; right: 24px; z-index: 9999;
    width: 340px; max-width: calc(100vw - 32px); height: 460px;
    background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    display: none; flex-direction: column;
  }
  #rcw-panel.open { display: flex; }

  #rcw-header {
    background: #0f6e56; color: #fff; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 15px;
  }
  #rcw-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; line-height: 1; }

  #rcw-messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    background: #f7f6f2;
  }

  .rcw-msg { max-width: 82%; padding: 9px 12px; border-radius: 10px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .rcw-msg.user { align-self: flex-end; background: #0f6e56; color: #fff; border-bottom-right-radius: 2px; }
  .rcw-msg.assistant { align-self: flex-start; background: #fff; color: #222; border: 1px solid #e2e0d8; border-bottom-left-radius: 2px; }
  .rcw-msg.typing { align-self: flex-start; color: #888; font-style: italic; }

  #rcw-form { display: flex; border-top: 1px solid #e2e0d8; }
  #rcw-input { flex: 1; border: none; padding: 12px 14px; font-size: 14px; outline: none; }
  #rcw-form button {
    background: #0f6e56; color: #fff; border: none; width: 48px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>

<script>
(function () {
  // Adresse de ton backend FastAPI (change en production)
  const BACKEND_URL = "http://localhost:8000/chat";

  const toggle = document.getElementById("rcw-toggle");
  const panel = document.getElementById("rcw-panel");
  const closeBtn = document.getElementById("rcw-close");
  const messagesEl = document.getElementById("rcw-messages");
  const form = document.getElementById("rcw-form");
  const input = document.getElementById("rcw-input");

  let history = [];
  let opened = false;

  toggle.addEventListener("click", () => {
    opened = !opened;
    panel.classList.toggle("open", opened);
    if (opened && messagesEl.children.length === 0) {
      addMessage("assistant", "Bonjour ! Je peux t'aider à créer un ticket de réparation ou à suivre le statut de ta réparation. Comment puis-je t'aider ?");
    }
  });
  closeBtn.addEventListener("click", () => { opened = false; panel.classList.remove("open"); });

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "rcw-msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    addMessage("user", text);

    const typingEl = addMessage("typing", "L'assistant écrit...");
    typingEl.classList.add("typing");

    try {
      const res = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history }),
      });
      const data = await res.json();
      typingEl.remove();
      addMessage("assistant", data.reply);
      history = data.history;
    } catch (err) {
      typingEl.remove();
      addMessage("assistant", "Désolé, une erreur est survenue. Réessaie dans un instant.");
      console.error(err);
    }
  });
})();
</script>
